name: Capture execution proving lockset supersession

on:
  push:
    branches:
      - isolate/N09A-physical-r2a-remediation
    paths:
      - .github/workflows/_capture-execution-proving-lockset.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R2A branch
        uses: actions/checkout@v4
        with:
          ref: isolate/N09A-physical-r2a-remediation
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Capture supersession and align roadmap
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const locksetPath = 'docs/00_Governance/ACTIVE_LOCKSET.json';
          const roadmapPath = 'docs/10_Development/NGAMSOI-N09PLUS-UIUX-PROGRAM-CLOSURE-ROADMAP.md';
          const baselinePath = 'docs/00_Governance/EXECUTION-PROVING-BASELINE.md';
          const protocolPath = 'docs/00_Governance/AGENT_LOCKSET_PROTOCOL.md';

          const lockset = JSON.parse(fs.readFileSync(locksetPath, 'utf8'));
          if (lockset.locksetVersion !== '2026.09.06.3') {
            throw new Error(`Expected lockset 2026.09.06.3, found ${lockset.locksetVersion}`);
          }

          const byId = new Map(lockset.requirements.map((r) => [r.id, r]));
          const oldAgent = byId.get('NGUI-AGENT-001');
          const oldCi = byId.get('NGUI-CI-001');
          if (!oldAgent || oldAgent.state !== 'LOCKED') throw new Error('NGUI-AGENT-001 is not the expected LOCKED authority');
          if (!oldCi || oldCi.state !== 'LOCKED') throw new Error('NGUI-CI-001 is not the expected LOCKED authority');
          if (byId.has('NGUI-AGENT-002') || byId.has('NGUI-CI-002')) throw new Error('Replacement requirement already exists');

          oldAgent.state = 'SUPERSEDED';
          oldAgent.supersededBy = 'NGUI-AGENT-002';
          oldCi.state = 'SUPERSEDED';
          oldCi.supersededBy = 'NGUI-CI-002';

          const agent002 = {
            id: 'NGUI-AGENT-002',
            title: 'PO-HQ-executor-challenger ownership baseline',
            state: 'LOCKED',
            statement: 'For governed N09+ implementation/remediation, the Product Owner is product/process authority and physical-acceptance authority, not the routine shell, patch, test or Git operator. Klopp/HQ owns governance preflight, impact analysis, bounded execution contracts, adjudication, review and gate control. Codex is the default local working-tree executor when attached to the repository and may edit/run only the authorised contract. Agentic recon may be used before implementation when ambiguity warrants it; after targeted green, a read-only challenger is used when risk warrants it, with Antigravity preferred for independence when Codex implemented. Challenger findings return to Klopp/HQ for adjudication and never self-authorise patches. CI confirms/proves the already-preproved exact candidate. No executor or challenger may weaken locks or self-elevate into Product Owner/Chief Architect authority.',
            enforcement: [
              { type: 'source', path: baselinePath },
              { type: 'source', path: protocolPath },
              { type: 'source', path: roadmapPath }
            ]
          };

          const ci002 = {
            id: 'NGUI-CI-002',
            title: 'Targeted-to-preprove first-pass-green proving contract',
            state: 'LOCKED',
            statement: 'Each governed N09+ candidate progresses through targeted authoritative testing, risk-appropriate read-only agentic challenge, then a complete stage-aware PREPROVE that mirrors the applicable official CI/runtime proof before freeze. PREPROVE includes lockset verification, frozen dependency/install parity, required typechecks, lint, Vitest/automated suites, production build, Linux/path/case portability checks, the applicable production-runtime browser gate with zero retries, git diff --check and bounded-scope/diff review. The desired steady state is one canonical preprove:<stage> command shared by local execution and official CI; until implemented, equivalent gates are mandatory explicitly. Only ALL GREEN may freeze an exact SHA. Promotion requires Product Owner authority where governance requires it, followed by one promotion push of the proven candidate; official CI is confirmation rather than the routine first deterministic-defect discovery environment. Every official red is classified as PRODUCT_DEFECT, HARNESS_DEFECT, ENVIRONMENT_PARITY, GOVERNANCE_PREFLIGHT or INFRASTRUCTURE before another candidate promotion. Red-loop thresholds remain 0 excellent, 1 classify, 2 process miss/review, 3+ stop and improve the mechanism. No green-by-bypass is permitted.',
            enforcement: [
              { type: 'source', path: baselinePath },
              { type: 'source', path: protocolPath },
              { type: 'source', path: roadmapPath },
              { type: 'source', path: 'playwright.config.ts' }
            ]
          };

          const insertBefore = lockset.requirements.findIndex((r) => r.id === 'NGUI-PR-001');
          if (insertBefore < 0) throw new Error('NGUI-PR-001 insertion anchor not found');
          lockset.requirements.splice(insertBefore, 0, agent002, ci002);
          lockset.locksetVersion = '2026.09.07.1';
          lockset.activeProgramme.executionBaseline = baselinePath;

          fs.writeFileSync(locksetPath, JSON.stringify(lockset, null, 2) + '\n');

          let roadmap = fs.readFileSync(roadmapPath, 'utf8');
          if (!roadmap.includes('**Execution/proving baseline supersession:** 2026-09-07')) {
            roadmap = roadmap.replace(
              '**Captured:** 2026-09-06  \n',
              '**Captured:** 2026-09-06  \n**Execution/proving baseline supersession:** 2026-09-07  \n',
            );
          }

          const oldExit = `N09A is complete only after:\n\n1. governance preflight;\n2. agentic recon where non-trivial;\n3. bounded implementation/remediation if needed;\n4. exact-head automated proof, including real-browser evidence where applicable;\n5. authoritative reprove;\n6. Product Owner physical acceptance on the current lineage.`;
          const newExit = `N09A is complete only after:\n\n1. governance preflight and LOCKED REQUIREMENT IMPACT MATRIX;\n2. bounded implementation/remediation by the authorised local executor if needed;\n3. the smallest authoritative targeted test/browser gate is green;\n4. agentic recon/challenge is used where ambiguity or risk warrants it and all findings are adjudicated before freeze;\n5. complete exact-head stage-aware PREPROVE is green, including real-browser evidence with zero retries where applicable;\n6. the exact candidate SHA is frozen, promoted under the required Product Owner authority and authoritatively reproved;\n7. Product Owner physical acceptance passes on that exact lineage.`;
          if (!roadmap.includes(oldExit)) throw new Error('N09A exit-gate anchor changed unexpectedly');
          roadmap = roadmap.replace(oldExit, newExit);

          const replacement = `## 8. Execution ownership and agentic operating model — shifted left\n\nCanonical operating authority is \`docs/00_Governance/EXECUTION-PROVING-BASELINE.md\`.\n\nDefault ownership:\n\n\`\`\`text\nProduct Owner   -> product/process authority + promotion authority where required + physical acceptance\nKlopp / HQ      -> governance / context / impact matrix / bounded contract / adjudication / review / gate control\nCodex           -> default local working-tree executor under the bounded contract\nAgentic helper  -> recon when ambiguity warrants; read-only challenge after targeted green when risk warrants\nCI              -> confirm/prove the already-preproved exact candidate\n\`\`\`\n\nThe Product Owner is not the routine shell, patch, test or Git operator. Lack of direct local-write access by Klopp/HQ must not be converted into a default requirement for the Product Owner to edit or run commands manually.\n\nWhen Codex implements, Antigravity is preferred as the independent challenger when available. A challenger does not self-authorise a patch; findings return to Klopp/HQ for adjudication and, when required, a new bounded executor pass. One helper remains the default and a second independent agent is reserved for high-risk unresolved ambiguity.\n\nFor governed implementation/remediation, the default gate order is:\n\n\`\`\`text\nGOVERNANCE PREFLIGHT\n-> LOCKED REQUIREMENT IMPACT MATRIX\n-> IMPLEMENT (authorised local executor)\n-> TARGETED TEST\n-> AGENTIC CHALLENGE when risk warrants\n-> PREPROVE — EXACT CI MIRROR\n-> ALL GREEN\n-> FREEZE EXACT SHA\n-> PRODUCT OWNER PROMOTION AUTHORITY where required\n-> ONE PROMOTION PUSH of the proven candidate\n-> OFFICIAL CI CONFIRMATION\n-> AUTHORITATIVE REPROVE where required\n-> PHYSICAL ACCEPT\n-> SEAL\n\`\`\`\n\nAgentic output never has authority to weaken a Product Owner lock, broaden an executor contract or make CI green by bypass.\n\n## 9. First-pass-green proving contract and efficiency metric\n\nOfficial CI is confirmation/proof of an already-preproved exact candidate. Deterministic product, harness, governance or environment-parity defects should be discovered before official promotion wherever technically possible.\n\nBefore freeze, the complete stage-aware PREPROVE must mirror the applicable official proof and include, where applicable:\n\n- lockset verification;\n- frozen dependency/install parity;\n- required typechecks;\n- lint;\n- Vitest / required automated suites;\n- production build;\n- Linux/path/case portability audit;\n- applicable production-runtime Playwright/browser gate;\n- zero Playwright retries;\n- \`git diff --check\`;\n- bounded-scope/diff review against the impact matrix.\n\nThe desired steady state is one canonical \`pnpm run preprove:<stage>\` contract called by both the local executor and official CI. Until that command exists, the same required gates must be executed explicitly; absence of the convenience command removes no gate.\n\nOnly an ALL GREEN exact candidate may freeze and become eligible for promotion. After the required Product Owner promotion authority, the proven candidate receives one promotion push. This means the first official push of that frozen candidate, not a prohibition on later governed replacements if an external or newly discovered issue genuinely requires a new candidate. Blind fix -> push -> red -> fix -> push loops are forbidden.\n\nEvery official red must be classified before another candidate promotion as one of:\n\n- \`PRODUCT_DEFECT\`;\n- \`HARNESS_DEFECT\`;\n- \`ENVIRONMENT_PARITY\`;\n- \`GOVERNANCE_PREFLIGHT\`;\n- \`INFRASTRUCTURE\`.\n\nOfficial red-loop process signal remains:\n\n- \`0\` official CI reds before green: excellent / target;\n- \`1\`: classify the miss;\n- \`2\`: process miss — review recon/preflight/preprove coverage before continuing;\n- \`3+\`: stop repeated proving and improve the mechanism before another attempt.\n\nLocal targeted-test, challenger or preprove failures that prevent a defective candidate from reaching official proving are successful shift-left discovery provided evidence is not weakened.\n\n`;

          const sectionPattern = /## 8\. Agentic operating model — shifted left[\s\S]*?(?=## 10\. No-green-by-bypass)/;
          if (!sectionPattern.test(roadmap)) throw new Error('Roadmap sections 8-9 anchor changed unexpectedly');
          roadmap = roadmap.replace(sectionPattern, replacement);
          fs.writeFileSync(roadmapPath, roadmap);

          const check = JSON.parse(fs.readFileSync(locksetPath, 'utf8'));
          const lockedCount = check.requirements.filter((r) => r.state === 'LOCKED').length;
          if (lockedCount !== 48) throw new Error(`Expected 48 LOCKED requirements after supersession, found ${lockedCount}`);
          if (check.requirements.find((r) => r.id === 'NGUI-AGENT-001')?.supersededBy !== 'NGUI-AGENT-002') throw new Error('Agent supersession lineage invalid');
          if (check.requirements.find((r) => r.id === 'NGUI-CI-001')?.supersededBy !== 'NGUI-CI-002') throw new Error('CI supersession lineage invalid');
          NODE

      - name: Install dependencies frozen
        run: pnpm install --frozen-lockfile

      - name: Verify captured lockset
        run: pnpm run lockset:verify

      - name: Governance diff safety
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/00_Governance/ACTIVE_LOCKSET.json\ndocs/10_Development/NGAMSOI-N09PLUS-UIUX-PROGRAM-CLOSURE-ROADMAP.md'

      - name: Remove one-shot transformer and commit capture
        shell: bash
        run: |
          git rm .github/workflows/_capture-execution-proving-lockset.yml
          git add docs/00_Governance/ACTIVE_LOCKSET.json docs/10_Development/NGAMSOI-N09PLUS-UIUX-PROGRAM-CLOSURE-ROADMAP.md
          git diff --cached --check
          git config user.name 'jenggon-governance-capture'
          git config user.email '292291271+jenggon@users.noreply.github.com'
          git commit -m 'docs(governance): capture execution proving supersession'
          git push origin HEAD:isolate/N09A-physical-r2a-remediation
