name: N09A Physical R1 Isolated Remediation Apply

on:
  push:
    branches:
      - isolate/N09A-physical-r1-remediation
    paths:
      - scripts/apply-n09a-physical-r1-remediation.mjs
      - .github/workflows/n09a-r1-remediation-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-bounded-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 1. Checkout isolated remediation branch
        uses: actions/checkout@v4
        with:
          ref: isolate/N09A-physical-r1-remediation
          fetch-depth: 0

      - name: 2. Record starting state
        run: |
          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD
          git status --short

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Apply deterministic bounded remediation
        run: node scripts/apply-n09a-physical-r1-remediation.mjs

      - name: 5. Validate generated tree and lockset
        run: |
          git diff --check
          node scripts/verify-lockset.mjs
          test ! -e scripts/apply-n09a-physical-r1-remediation.mjs
          test ! -e .github/workflows/n09a-r1-remediation-apply.yml

      - name: 6. Commit isolated product candidate
        run: |
          git config user.name "jenggon"
          git config user.email "292291271+jenggon@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation diff produced" >&2
            exit 1
          fi
          git commit -m "fix(N09A): remediate physical acceptance round 1"
          git push origin HEAD:isolate/N09A-physical-r1-remediation
