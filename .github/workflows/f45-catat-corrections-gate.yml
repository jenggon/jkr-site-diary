name: F4.5 CATAT Corrections Gate

on:
  push:
    branches:
      - feature/F4.5-catat-corrections-1-6
      - feature/F4.5-final-visual-reconciliation
      - feature/F4.5-ui-authority-cutover
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unified verification contract
        run: pnpm run verify
      - name: Install Chromium for F4.5 UI authority gate
        if: github.ref_name == 'feature/F4.5-ui-authority-cutover'
        run: pnpm exec playwright install --with-deps chromium
      - name: Real-browser F4.5 UI authority gate
        if: github.ref_name == 'feature/F4.5-ui-authority-cutover'
        run: pnpm exec playwright test tests/e2e/f45-ui-authority.e2e.spec.ts --project=chromium
