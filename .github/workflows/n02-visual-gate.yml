name: N02 NGAMSOI Source Loaded Gate

on:
  push:
    branches:
      - feature/N02-ngamsoi-mobile-source-loaded

jobs:
  n02-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout N02 branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification contract
        run: pnpm run verify

      - name: Install Chromium for N02 visual gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture deterministic N02 source-loaded gate
        run: pnpm exec tsx scripts/capture-ngamsoi-n02.ts

      - name: Upload N02 evidence
        uses: actions/upload-artifact@v4
        with:
          name: n02-ngamsoi-source-loaded-gate
          path: docs/evidence/n02-ngamsoi/n02-record-loaded-375x812.png
          if-no-files-found: error
          retention-days: 14
