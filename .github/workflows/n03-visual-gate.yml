name: N03 NGAMSOI Field Language Gate

on:
  push:
    branches:
      - feature/N03-ngamsoi-field-input-language

jobs:
  n03-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout N03 branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification contract
        run: pnpm run verify

      - name: Install Chromium for N03 visual gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture deterministic N03 field language gate
        run: pnpm exec tsx scripts/capture-ngamsoi-n03.ts

      - name: Upload N03 evidence
        uses: actions/upload-artifact@v4
        with:
          name: n03-ngamsoi-field-language-gate
          path: docs/evidence/n03-ngamsoi/n03-field-language-375x812.png
          if-no-files-found: error
          retention-days: 14
