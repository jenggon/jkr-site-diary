name: Capture workspace alignment lock

on:
  push:
    branches:
      - isolate/N09A-physical-r2a-remediation
    paths:
      - .github/workflows/_capture-workspace-alignment-lock.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: isolate/N09A-physical-r2a-remediation
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Capture additive workspace alignment lock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/00_Governance/ACTIVE_LOCKSET.json';
          const lockset = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (lockset.locksetVersion !== '2026.09.07.1') {
            throw new Error(`Expected lockset 2026.09.07.1, found ${lockset.locksetVersion}`);
          }
          if (lockset.requirements.some((r) => r.id === 'NGUI-EXEC-001')) {
            throw new Error('NGUI-EXEC-001 already exists');
          }

          const requirement = {
            id: 'NGUI-EXEC-001',
            title: 'Safe workspace alignment before governance ACK',
            state: 'LOCKED',
            statement: 'Before governed implementation/remediation produces a LOCKSET COMPLIANCE ACK, the attached local executor must prove alignment to the expected governed branch and exact remote HEAD supplied by Klopp/HQ. Same-head requires no mutation. A stale local HEAD may auto-align only when it is an exact ancestor of the governed target, there are no unsafe unauthorised tracked modifications, declared protected local paths remain untouched by the incoming range, and the update completes by fast-forward only after fetch. Local-ahead, diverged, protected-path-collision, unresolved-target, unsafe-dirty-state or ambiguous conditions must STOP to HQ. Generic pull, reset, clean, stash, forced checkout/ref movement, automatic rebase and merge-commit recovery are forbidden alignment mechanisms. After any remote governance mutation, local/remote equality must be reproved and lockset verification rerun from the aligned local HEAD before implementation.',
            enforcement: [
              { type: 'source', path: 'docs/00_Governance/EXECUTION-PROVING-BASELINE.md' },
              { type: 'source', path: 'docs/00_Governance/AGENT_LOCKSET_PROTOCOL.md' },
              { type: 'source', path: 'docs/10_Development/NGAMSOI-N09PLUS-UIUX-PROGRAM-CLOSURE-ROADMAP.md' },
              { type: 'manual', note: 'Execution contracts must carry EXPECTED_BRANCH, EXPECTED_GOVERNED_HEAD and protected local paths; executor reports must record local-before, governed-target, local-after and alignment mode.' }
            ]
          };

          const insertBefore = lockset.requirements.findIndex((r) => r.id === 'NGUI-PR-001');
          if (insertBefore < 0) throw new Error('NGUI-PR-001 insertion anchor not found');
          lockset.requirements.splice(insertBefore, 0, requirement);
          lockset.locksetVersion = '2026.09.07.2';

          const lockedCount = lockset.requirements.filter((r) => r.state === 'LOCKED').length;
          if (lockedCount !== 49) {
            throw new Error(`Expected 49 LOCKED requirements, found ${lockedCount}`);
          }

          fs.writeFileSync(path, JSON.stringify(lockset, null, 2) + '\n');
          NODE

      - name: Install dependencies frozen
        run: pnpm install --frozen-lockfile

      - name: Verify captured lockset
        run: pnpm run lockset:verify

      - name: Governance diff safety
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'docs/00_Governance/ACTIVE_LOCKSET.json'

      - name: Remove capture harness and commit lock
        shell: bash
        run: |
          git rm .github/workflows/_capture-workspace-alignment-lock.yml
          git add docs/00_Governance/ACTIVE_LOCKSET.json
          git diff --cached --check
          git config user.name 'jenggon-governance-capture'
          git config user.email '292291271+jenggon@users.noreply.github.com'
          git commit -m 'docs(governance): capture workspace alignment preflight'
          git push origin HEAD:isolate/N09A-physical-r2a-remediation
