name: N09A R1 Stale Source-Copy Test Repair

on:
  push:
    branches:
      - isolate/N09A-physical-r1-remediation
    paths:
      - scripts/repair-n09a-r1-stale-source-copy-tests.mjs
      - .github/workflows/n09a-r1-stale-source-copy-test-repair.yml

permissions:
  contents: write

jobs:
  repair-stale-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated remediation branch
        uses: actions/checkout@v4
        with:
          ref: isolate/N09A-physical-r1-remediation
          fetch-depth: 0

      - name: Apply exact stale-test repair
        shell: bash
        run: node scripts/repair-n09a-r1-stale-source-copy-tests.mjs

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/repair-n09a-r1-stale-source-copy-tests.mjs
          test ! -e .github/workflows/n09a-r1-stale-source-copy-test-repair.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/n09a-r1-stale-source-copy-test-repair.yml \
            scripts/repair-n09a-r1-stale-source-copy-tests.mjs \
            tests/integration/ui/dailyEntryNavigationFlow.test.ts \
            tests/integration/ui/openActivitiesUi.test.ts \
            tests/unit/ui/operationalSourceSelector.test.ts | sort)"
          test "$changed" = "$expected"

      - name: Commit bounded test repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jenggon"
          git config user.email "292291271+jenggon@users.noreply.github.com"
          git add -A
          git commit -m "test(N09A): align stale source-copy assertions"
          git push origin HEAD:isolate/N09A-physical-r1-remediation
