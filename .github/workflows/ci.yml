name: CI Workflow

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 1. Install dependencies
        run: pnpm install

      - name: 2. Type Check
        run: pnpm run typecheck

      - name: 3. Lint
        run: pnpm run lint

      - name: 4. Unit Test
        run: pnpm run test

      - name: 5. Build
        run: pnpm run build

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            .next/
            public/
            package.json
          retention-days: 7
