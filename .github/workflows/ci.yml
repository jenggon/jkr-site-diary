name: CI Workflow

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout exact frozen F4.5 R2 candidate
        uses: actions/checkout@v4
        with:
          ref: 1fb541ffc8e361dd447432c2844a043c6dc570e8

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 1. Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 2. Unified verification contract
        run: pnpm run verify

      - name: 3. Install Chromium for exact-head F4.5 proving gate
        run: pnpm exec playwright install --with-deps chromium

      - name: 4. Exact-head F4.5 browser proving gate
        run: pnpm exec playwright test tests/e2e/f45-ui-authority.e2e.spec.ts --project=chromium --retries=0

      - name: 5. Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f45-isolated-browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            .next/
            public/
            package.json
          retention-days: 7
