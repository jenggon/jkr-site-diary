name: N01 NGAMSOI Runtime Visual Gate

on:
  push:
    branches:
      - feature/N01-ngamsoi-brand-foundation

jobs:
  n01-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout N01 branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification contract
        run: pnpm run verify

      - name: Install Chromium for N01 visual gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture deterministic N01 mobile identity gate
        run: pnpm exec tsx scripts/capture-ngamsoi-n01.ts

      - name: Upload N01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: n01-ngamsoi-visual-gate
          path: docs/evidence/n01-ngamsoi/n01-brand-gate-375x812.png
          if-no-files-found: error
          retention-days: 14
