name: N04 NGAMSOI Workforce Gate

on:
  push:
    branches:
      - feature/N04-ngamsoi-workforce-rebuild

jobs:
  n04-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout N04 branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification contract
        run: pnpm run verify

      - name: Install Chromium for N04 visual gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture deterministic N04 workforce gate
        run: pnpm exec tsx scripts/capture-ngamsoi-n04.ts

      - name: Upload N04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: n04-ngamsoi-workforce-gate
          path: docs/evidence/n04-ngamsoi/n04-workforce-375x812.png
          if-no-files-found: error
          retention-days: 14
