name: N05R NGAMSOI Integrated Runtime Gate

on:
  push:
    branches:
      - feature/N05R-ngamsoi-integrated-visual-reset

jobs:
  n05r-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout N05R branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification contract
        run: pnpm run verify

      - name: Install Chromium for live visual gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production runtime
        run: |
          pnpm start > /tmp/n05r-next.log 2>&1 &
          echo $! > /tmp/n05r-next.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/site-diary > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/n05r-next.log
          exit 1

      - name: Capture live Mobile New Entry composition
        run: pnpm exec tsx scripts/capture-ngamsoi-n05r-runtime.ts

      - name: Upload N05R runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: n05r-ngamsoi-live-runtime-gate
          path: docs/evidence/n05r-ngamsoi/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Stop production runtime
        if: always()
        run: |
          if [ -f /tmp/n05r-next.pid ]; then
            kill "$(cat /tmp/n05r-next.pid)" || true
          fi
